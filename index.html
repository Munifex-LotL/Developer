<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light of the Lost | Play</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080808;color:#e8d9b2;font-family:Georgia,serif;overflow:hidden}#game{display:block;width:100%;height:100%;border:0;background:#080808}.fullscreen{position:fixed;right:16px;top:16px;z-index:5;padding:10px 14px;border:1px solid #927440;border-radius:4px;background:#111d;color:#f3e3b8;cursor:pointer;font:14px system-ui,sans-serif}.fullscreen:hover{background:#302613}
</style>
</head>
<body>
<button class="fullscreen" id="fullscreen" type="button">⛶ Full screen</button>
<iframe id="game" src="game.html" title="Light of the Lost game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
<script>
document.getElementById('fullscreen').addEventListener('click',async()=>{
  try { if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }
  catch(e) { console.warn('Fullscreen unavailable:',e); }
});
</script>
</body>
</html>
