<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Light of the Lost | Play</title>
<style>
:root{color-scheme:dark;--bg:#0c0b0a;--gold:#bd9a58;--cream:#eee4d3;--muted:#a69b89}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;height:100%;background:var(--bg);color:var(--cream)}body{font-family:Georgia,'Times New Roman',serif;overflow:hidden}button{font:inherit;cursor:pointer}button:focus-visible,.file-btn:focus-within{outline:2px solid #efd399;outline-offset:4px}
#player{position:fixed;inset:0;width:100%;height:100%;border:0;background:#060606;display:none}body.playing #player{display:block}body.playing #landing{display:none}
#landing{position:relative;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:32px 18px;overflow:auto;background:radial-gradient(ellipse at 50% 35%,#322717 0%,#18140f 37%,#0c0b0a 72%)}#landing:before{content:"";position:fixed;inset:18px;border:1px solid #6b5633;pointer-events:none;opacity:.52}#landing:after{content:"";position:fixed;inset:25px;border:1px solid #3c3021;pointer-events:none;opacity:.6}
.panel{width:min(570px,100%);position:relative;z-index:1;text-align:center;padding:40px 18px}.ornament{font-size:28px;color:var(--gold);margin-bottom:25px;letter-spacing:14px}.eyebrow{font:11px system-ui,sans-serif;letter-spacing:.36em;text-transform:uppercase;color:#d2b77e;margin-bottom:16px}h1{font-weight:400;text-transform:uppercase;letter-spacing:.11em;font-size:clamp(36px,8vw,63px);line-height:1.02;margin:0;text-shadow:0 4px 24px #000}.rule{width:130px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:30px auto}.subtitle{font-style:italic;color:#c6b99e;font-size:18px;line-height:1.5;margin:0 auto 29px;max-width:370px}.primary,.secondary,.file-btn{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:12px 25px;border:1px solid var(--gold);background:#a78242;color:#160f08;text-transform:uppercase;font-family:system-ui,sans-serif;font-size:11px;font-weight:750;letter-spacing:.18em;transition:filter .15s}.primary:hover,.secondary:hover,.file-btn:hover{filter:brightness(1.15)}.primary{min-width:235px}.secondary,.file-btn{background:rgba(12,11,10,.35);color:var(--cream)}.file-btn input{display:none}.actions{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}.note{font:12px/1.7 system-ui,sans-serif;color:var(--muted);margin:24px auto 0;max-width:410px}.note strong{color:#dbc497;font-weight:600}.footer{font:10px system-ui,sans-serif;color:#7b705c;text-transform:uppercase;letter-spacing:.2em;margin-top:60px}.hide{display:none!important}
#toolbar{position:fixed;top:12px;right:12px;z-index:10;display:none;gap:8px}body.playing #toolbar{display:flex}#toolbar button{border:1px solid #80683d;background:#14110cdd;color:#f3e4c5;font:12px system-ui,sans-serif;padding:9px 12px;border-radius:3px}#toast{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);font:12px system-ui,sans-serif;background:#17140f;color:#f0dfbd;padding:10px 16px;border:1px solid #65502e;display:none;z-index:20;text-align:center}#toast.visible{display:block}
@media(max-width:450px){.panel{padding:25px 8px}.footer{margin-top:35px}#landing:before{inset:9px}#landing:after{inset:14px}}
</style>
</head>
<body>
<main id="landing"><section class="panel"><div class="ornament" aria-hidden="true">✠</div><div class="eyebrow">An adventure of faith and courage</div><h1>Light of<br>the Lost</h1><div class="rule"></div><p class="subtitle">In the gathering darkness, carry the light.</p><div class="actions"><button class="primary" id="play">Play game</button><label class="file-btn">Choose HTML file<input id="picker" type="file" accept=".html,.htm,text/html"></label></div><p class="note" id="status">To publish your game, place <strong>game.html</strong> in the same directory as <strong>index.html</strong>. You can also choose a local HTML file to test it here.</p><div class="footer">Light of the Lost · Browser Edition</div></section></main>
<iframe id="player" title="Light of the Lost game" allow="fullscreen;autoplay;gamepad" allowfullscreen></iframe>
<nav id="toolbar"><button id="back">← Menu</button><button id="fullscreen">Full screen ⛶</button></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
 const frame=document.getElementById('player'),status=document.getElementById('status'),toast=document.getElementById('toast');
 let fileURL=null,hosted=false;
 function notify(msg){toast.textContent=msg;toast.classList.add('visible');setTimeout(()=>toast.classList.remove('visible'),3500)}
 function launch(url){frame.src=url;document.body.classList.add('playing');frame.focus()}
 async function hostedGameExists(){
   // A local file:// URL cannot reliably fetch siblings, but direct hosting works.
   try{const res=await fetch('./game.html',{cache:'no-store'});if(!res.ok)return false;
     const html=await res.text();const type=res.headers.get('content-type')||'';
     if(type.includes('text/html')&&!/\b(?:<html|<canvas|<script|<!doctype html)\b/i.test(html))return false;
     if(!/<(?:!doctype\s+html|html\b|head\b|body\b|script\b|canvas\b)/i.test(html))return false;
     return true;
   }catch{return false}
 }
 document.getElementById('play').addEventListener('click',async()=>{
   if(fileURL){launch(fileURL);return}
   if(hosted||await hostedGameExists()){hosted=true;launch('./game.html');return}
   status.innerHTML='Game not found. Upload <strong>game.html</strong> next to <strong>index.html</strong>, or click <strong>Choose HTML file</strong> to test your game.';
   notify('No game.html found yet');
 });
 document.getElementById('picker').addEventListener('change',e=>{
   const file=e.target.files&&e.target.files[0];if(!file)return;
   if(fileURL)URL.revokeObjectURL(fileURL);
   fileURL=URL.createObjectURL(file);status.textContent='Selected: '+file.name;launch(fileURL)
 });
 document.getElementById('back').addEventListener('click',()=>{document.body.classList.remove('playing');frame.src='about:blank'});
 document.getElementById('fullscreen').addEventListener('click',async()=>{
   try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{notify('Full screen is not supported here')}
 });
 hostedGameExists().then(exists=>{hosted=exists;if(exists)status.innerHTML='The game is ready. Select <strong>Play game</strong> to begin.'});
})();
</script>
</body>
</html>
